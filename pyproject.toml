[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lorewell"
description = "Reference packs for languages and their tools, that an agent looks things up in instead of holding them in context: one SQLite file each, installed as a skill any skill-reading agent can use (designed for hobkin; Claude Code reads it as it is)."
dynamic = ["version"]   # from lorewell.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["agent", "llm", "ai", "skills", "reference", "documentation", "rag", "sqlite", "mcp", "hobkin", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/frank-lynam/lorewell"
Issues = "https://github.com/frank-lynam/lorewell/issues"
hobkin = "https://github.com/frank-lynam/hobkin"

[project.scripts]
lorewell = "lorewell:cli"

[tool.flit.sdist]
include = ["tests/", "packs/", "docs/"]
exclude = ["CLAUDE.md", "AGENTS.md"]
